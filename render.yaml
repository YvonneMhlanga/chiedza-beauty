# Render Blueprint for the Chiedza Beauty backend (Express + SQLite).
# render.com -> New -> Blueprint -> pick this repo. It creates the web service below.
#
# The frontend (repo root) stays on Vercel. After this deploys, copy the service
# URL and set it on Vercel as:  NEXT_PUBLIC_API_URL = https://<service>.onrender.com/api
#
# For permanent data set DATABASE_URL (Neon Postgres) below. With it, uploaded
# images are stored in Postgres too (served from /api/uploads/file/:id) — no
# image host needed. Optionally set CLOUDINARY_URL to use Cloudinary instead.
# Without DATABASE_URL the app runs on SQLite + local disk, which the free plan
# wipes on each redeploy (demo salons/styles still re-seed on boot).

services:
  - type: web
    name: chiedza-backend
    runtime: node
    plan: free
    rootDir: chiedza-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Neon Postgres connection string (postgresql://...). Paste in the Render
      # dashboard. Leave unset to fall back to SQLite.
      - key: DATABASE_URL
        sync: false
      # Optional: use Cloudinary for images instead of Postgres
      # (cloudinary://<key>:<secret>@<cloud>). Leave unset to store in Postgres.
      - key: CLOUDINARY_URL
        sync: false
      # Optional: pin the Google OAuth client id server-side. If blank, the
      # backend trusts (and still fully verifies) the id the frontend sends.
      - key: GOOGLE_CLIENT_ID
        sync: false
